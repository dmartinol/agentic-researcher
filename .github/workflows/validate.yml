name: Validate package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package contract
        run: python scripts/validate.py
      - name: Run tests
        run: python -m pip install pytest && pytest -q
